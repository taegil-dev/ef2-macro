name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd agent
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        working-directory: ./agent
        shell: pwsh
        run: |
          pyinstaller --distpath dist agent.spec
          pyinstaller --distpath dist updater.spec

      - name: Create ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package

          Copy-Item ./agent/dist/agent.exe package/
          Copy-Item ./agent/dist/updater.exe package/

          Copy-Item ./agent/macro.py package/
          Copy-Item ./agent/.env.example package/
          Copy-Item ./agent/version.json package/
          Copy-Item ./agent/templates -Destination package/templates -Recurse
          Compress-Archive -Path package/* -DestinationPath update.zip

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" update.zip --generate-notes --latest
