name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: pyinstaller agent.spec

      - name: Create ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package
          Copy-Item dist/agent.exe package/
          Copy-Item version.json package/
          Compress-Archive -Path package/* -DestinationPath update.zip

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" update.zip --generate-notes --latest
